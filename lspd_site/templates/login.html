{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <img src="{{ url_for('static', filename='img/lspd-logo.png') }}"
             alt="LSPD"
             class="login-logo">
        <h1>LegestyCity PD</h1>
        <p class="sub">SECURE ACCESS TERMINAL</p>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="اسم المستخدم" required autofocus>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">دخول آمن 🔐</button>
        </form>
    </div>
</div>
{% endblock %}
